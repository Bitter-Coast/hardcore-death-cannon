plugins {
    id 'java'
}

group = 'io.github.deathcannon'

repositories {
    maven { url = 'https://repo.runelite.net' }
    mavenCentral()
}

def runeLiteVersion = '1.13.6'
dependencies {
    compileOnly "net.runelite:client:${runeLiteVersion}"
    testImplementation "net.runelite:client:${runeLiteVersion}"
    testRuntimeOnly "net.runelite:jshell:${runeLiteVersion}"
    testRuntimeOnly 'net.runelite:jagexauth:0.3'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(11)
}

tasks.register('run', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'io.github.deathcannon.DeathCannonLauncher'
    args '--developer-mode', '--debug'
    jvmArgs '-ea'
}
